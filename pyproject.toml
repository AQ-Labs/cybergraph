[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybergraph"
version = "0.1.0"
description = "Cybersecurity knowledge graph for code review with evidence-backed answers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Azizur Rahman" }]
keywords = ["security", "knowledge-graph", "code-review", "rag", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/khan-ARK/cybergraph"
Repository = "https://github.com/khan-ARK/cybergraph"
Issues = "https://github.com/khan-ARK/cybergraph/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
mcp = ["fastmcp>=2"]
llm = ["anthropic>=0.40", "openai>=1.40"]
all = ["fastmcp>=2", "anthropic>=0.40", "openai>=1.40"]

[project.scripts]
cybergraph = "cybergraph.cli:main"
cybergraph-mcp = "cybergraph.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cybergraph"]
artifacts = ["src/cybergraph/assets/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# The GitHub Actions workflow template embeds YAML run commands that cannot be
# wrapped without changing the emitted workflow file.
"src/cybergraph/init_project.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

