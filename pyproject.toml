[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybergraph"
version = "0.1.0"
description = "Cybersecurity knowledge graph for code review with evidence-backed answers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Azizur Rahman" }]
keywords = ["security", "knowledge-graph", "code-review", "rag", "sast"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
mcp = ["fastmcp>=2"]

[project.scripts]
cybergraph = "cybergraph.cli:main"
cybergraph-mcp = "cybergraph.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

