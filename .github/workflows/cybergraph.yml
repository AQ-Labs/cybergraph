name: CyberGraph

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. This workflow runs untrusted PR code (including from
# forks once the repo is public), so it never holds write scopes. The PR
# comment is posted by the separate ci-report.yml (workflow_run), which runs
# from the default branch and therefore gets a write token safely.
permissions:
  contents: read
  security-events: write # upload-sarif; auto-downgraded to read for fork PRs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security-graph:
    name: Build security graph
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base branch present for `cybergraph review`

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CyberGraph
        run: python -m pip install -e .

      - name: Build graph
        run: cybergraph build .

      - name: Check the change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # checkout above uses fetch-depth: 0 (full history); fetch the base
          # branch ref so merge-base can resolve. (--depth=0 is invalid.)
          git fetch --no-tags origin "$BASE_REF"
          cybergraph check . --mode merge-base --base "origin/$BASE_REF" \
            | tee cybergraph-check.txt

      - name: Review security delta
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cybergraph review --base "origin/$BASE_REF" --repo . | tee cybergraph-review.txt

      - name: Generate PR comment
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cybergraph pr-comment --base "origin/$BASE_REF" --repo . --output cybergraph-pr-comment.md

      - name: Record PR number for the report workflow
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Export SARIF
        run: cybergraph sarif --repo . --output cybergraph.sarif

      - name: Drop informational sink-inventory findings from the self-scan SARIF
        # CG-*-SINK-CALL marks "a sensitive sink is used here" — useful inventory
        # for downstream analysis, but not actionable on CyberGraph's own
        # parameterized sqlite calls. Keep the code scanning tab signal-only.
        run: |
          jq '.runs[].results |= map(select(.ruleId | test("^CG-.*SINK-CALL$") | not))' \
            cybergraph.sarif > cybergraph.filtered.sarif
          mv cybergraph.filtered.sarif cybergraph.sarif

      - name: Generate HTML report
        run: cybergraph visualize . --output cybergraph-report.html

      - name: Upload SARIF to code scanning
        if: github.event.repository.private == false || vars.CYBERGRAPH_UPLOAD_SARIF == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: cybergraph.sarif

      - name: Upload CyberGraph artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cybergraph-report
          path: |
            cybergraph.sarif
            cybergraph-report.html
            cybergraph-check.txt
            cybergraph-review.txt
            cybergraph-pr-comment.md
            pr-number.txt
          if-no-files-found: ignore
